<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inbox</title>
    <style>
        body { font-family: sans-serif; background: #0b0f19; color: white; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 300px; background: #111622; border-right: 1px solid #1e293b; padding: 20px; overflow-y: auto; }
        .main { flex: 1; padding: 20px; color: #fff; }
        .email { background: #111c24; padding: 15px; margin-bottom: 10px; cursor: pointer; border-radius: 5px; border: 1px solid #334155; }
        .email:hover { background: #1e293b; }
    </style>
</head>
<body>
    <div class="sidebar" id="list"><h3>Loading...</h3></div>
    <div class="main" id="content"><h2>Select an email</h2></div>

    <script>
        // التحقق من تسجيل الدخول
        if (!localStorage.getItem('isLoggedIn')) window.location.href = 'login.html';

        async function loadEmails() {
            try {
                const res = await fetch('/api/receive-email');
                const data = await res.json();
                const list = document.getElementById('list');
                list.innerHTML = '<h3>Inbox</h3>';
                
                data.forEach(mail => {
                    const div = document.createElement('div');
                    div.className = 'email';
                    div.innerHTML = `<h4>${mail.sender || 'Unknown'}</h4><p>${mail.subject || 'No Subject'}</p>`;
                    div.onclick = () => document.getElementById('content').innerHTML = `<h3>${mail.subject}</h3><p>${mail.body || "No content"}</p>`;
                    list.appendChild(div);
                });
            } catch (e) { document.getElementById('list').innerHTML = "Error loading"; }
        }
        loadEmails();
    </script>
</body>
</html>
