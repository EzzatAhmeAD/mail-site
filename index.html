<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Instant Code Receiver</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* تحسين السكرول بار ليناسب الدارك مود */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background: #0b0f19; 
            color: #ffffff;
            display: flex; 
            flex-direction: column;
            height: 100vh; 
            overflow: hidden; 
        }
        .header {
            background: #111c24;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        .header h1 { margin: 0; font-size: 22px; font-weight: 600; color: #38bdf8; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: #94a3b8; }
        .logout-btn { 
            background: #1e293b; 
            color: #f1f5f9; 
            border: 1px solid #334155; 
            padding: 8px 18px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 500; 
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .logout-btn:hover { background: #334155; color: #ff4d4f; }

        .app-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { 
            width: 340px; 
            background: #111622; 
            height: 100%; 
            border-right: 1px solid #1e293b; 
            padding: 20px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
        }
        .tabs { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px; }
        .tabs button { 
            flex: 1; 
            padding: 10px; 
            cursor: pointer; 
            border: 1px solid #1e293b; 
            background: #1e293b; 
            color: #94a3b8; 
            border-radius: 6px; 
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .tabs button.active { background: #0284c7; color: white; border-color: #0284c7; }
        
        .sidebar-actions { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .sidebar-title { font-size: 15px; font-weight: 600; color: #cbd5e1; display: flex; align-items: center; gap: 8px; }
        .sidebar-title .count { background: #1e293b; padding: 2px 8px; border-radius: 12px; font-size: 12px; color: #38bdf8; }
        
        .icon-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 5px; font-family: 'Inter', sans-serif; }
        .icon-btn:hover { color: #fff; }

        #clear-trash-btn { 
            background: rgba(220, 38, 38, 0.1); 
            color: #ef4444; 
            border: 1px solid #dc2626; 
            width: 100%; 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            display: none; 
            margin-bottom: 15px; 
            font-weight: 600; 
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        #clear-trash-btn:hover { background: #dc2626; color: white; }

        .emails-scroll { flex: 1; overflow-y: auto; padding-right: 5px; }
        .email-item { 
            background: #111c24; 
            padding: 16px; 
            margin-bottom: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            border: 1px solid #1e293b; 
            position: relative;
            transition: all 0.2s ease;
        }
        .email-item:hover { border-color: #475569; transform: translateY(-1px); }
        .email-item.selected { border-color: #38bdf8; background: #152232; }
        .email-item h4 { margin: 0 0 6px 0; color: #e2e8f0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .email-item p { margin: 0 0 12px 0; font-size: 13px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .email-item .time { font-size: 11px; color: #64748b; float: right; font-weight: 500; }
        
        .action-btn { background: #334155; color: #f1f5f9; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: 'Inter', sans-serif; transition: 0.2s; }
        .action-btn:hover { background: #ef4444; color: white; }
        .action-btn.restore { background: #166534; }
        .action-btn.restore:hover { background: #15803d; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; background: #0b0f19; }
        .email-details-header { background: #111c24; padding: 25px; border-radius: 10px 10px 0 0; border: 1px solid #1e293b; border-bottom: none; }
        .email-details-header h3 { margin: 0 0 12px 0; font-size: 20px; font-weight: 600; color: #fff; }
        .email-details-header p { margin: 5px 0; font-size: 14px; color: #94a3b8; }
        .email-details-header span { color: #38bdf8; font-weight: 500; }
        
        #email-body { 
            background: #ffffff; 
            color: #0f172a;
            padding: 30px; 
            border: 1px solid #1e293b; 
            min-height: 500px; 
            border-radius: 0 0 10px 10px; 
            overflow-x: auto;
            font-size: 14px;
            line-height: 1.6;
        }
        .empty-view { color: #64748b; text-align: center; margin-top: 150px; font-size: 16px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>Instant Code Receiver</h1>
            <p>Active Account: user55@ezzatrabie.com</p>
        </div>
        <button class="logout-btn" onclick="logout()">Logout ➔</button>
    </div>

    <div class="app-container">
        <div class="sidebar">
            <div class="tabs">
                <button id="tab-inbox" class="active" onclick="switchTab('inbox')">Inbox</button>
                <button id="tab-trash" onclick="switchTab('trash')">Trash</button>
            </div>
            
            <div class="sidebar-actions">
                <div class="sidebar-title">
                    <span id="list-title">Messages</span>
                    <span class="count" id="mail-count">0</span>
                </div>
                <button class="icon-btn" onclick="fetchEmails()">🔁 Refresh</button>
            </div>
            
            <button id="clear-trash-btn" onclick="clearAllTrash()">Empty Trash Permanently</button>

            <div class="emails-scroll" id="emails-list">
                </div>
        </div>

        <div class="main-content" id="mail-viewer">
            <div class="empty-view" id="empty-message">
                Select an email to view its content here...
            </div>
            <div id="email-card" style="display: none;">
                <div class="email-details-header">
                    <h3 id="view-subject">Subject</h3>
                    <p>From: <span id="view-from">sender</span></p>
                </div>
                <div id="email-body">
                    </div>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true' && sessionStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        let allEmails = [];
        let currentTab = 'inbox';
        let selectedEmailId = null;

        async function fetchEmails() {
            try {
                const response = await fetch('/api/receive-email'); 
                const data = await response.json();
                
                allEmails = data.map(email => ({
                    ...email,
                    isDeleted: email.isDeleted || false 
                }));
                
                renderEmails();
            } catch (error) {
                console.error("Error fetching emails:", error);
            }
        }

        function renderEmails() {
            const listContainer = document.getElementById('emails-list');
            listContainer.innerHTML = ''; 

            let filteredEmails = allEmails.filter(email => {
                if (currentTab === 'inbox') return !email.isDeleted;
                if (currentTab === 'trash') return email.isDeleted;
            });

            document.getElementById('mail-count').innerText = filteredEmails.length;
            document.getElementById('list-title').innerText = currentTab === 'inbox' ? 'Inbox Messages' : 'Trash Folder';

            document.getElementById('clear-trash-btn').style.display = (currentTab === 'trash' && filteredEmails.length > 0) ? 'block' : 'none';

            if (filteredEmails.length === 0) {
                listContainer.innerHTML = '<div style="color:#64748b; text-align:center; padding:30px 20px; font-size:14px;">No emails found</div>';
                return;
            }

            filteredEmails.reverse().forEach(email => {
                const isSelected = selectedEmailId == email.id ? 'selected' : '';
                const fromAddress = email.sender || email.source || email.from || 'Unknown Sender';
                const subjectText = email.subject || 'No Subject';
                const timeText = email.received || email.time || '';

                const btnAction = currentTab === 'inbox' 
                    ? `<button class="action-btn" onclick="moveToTrash(event, '${email.id}')">Trash</button>`
                    : `<button class="action-btn" onclick="deletePermanently(event, '${email.id}')">Delete</button>
                       <button class="action-btn restore" onclick="restoreEmail(event, '${email.id}')">Restore</button>`;

                const emailHTML = `
                    <div class="email-item ${isSelected}" onclick="showContent('${email.id}')">
                        <span class="time">${timeText}</span>
                        <h4>${fromAddress}</h4>
                        <p>${subjectText}</p>
                        ${btnAction}
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', emailHTML);
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-inbox').classList.toggle('active', tab === 'inbox');
            document.getElementById('tab-trash').classList.toggle('active', tab === 'trash');
            renderEmails();
        }

        function showContent(id) {
            selectedEmailId = id;
            const email = allEmails.find(e => e.id == id);
            if (email) {
                document.getElementById('empty-message').style.display = 'none';
                document.getElementById('email-card').style.display = 'block';
                
                document.getElementById('view-subject').innerText = email.subject || 'No Subject';
                document.getElementById('view-from').innerText = email.sender || email.source || email.from || 'Unknown Sender';
                document.getElementById('email-body').innerHTML = email.rawBody || email.body || email.html || "No Content";
                
                renderEmails();
            }
        }

        function moveToTrash(event, id) {
            event.stopPropagation(); 
            const email = allEmails.find(e => e.id == id);
            if (email) email.isDeleted = true;
            resetViewerIfActive(id);
            renderEmails();
        }

        function restoreEmail(event, id) {
            event.stopPropagation();
            const email = allEmails.find(e => e.id == id);
            if (email) email.isDeleted = false;
            resetViewerIfActive(id);
            renderEmails();
        }

        function deletePermanently(event, id) {
            event.stopPropagation();
            allEmails = allEmails.filter(e => e.id != id);
            resetViewerIfActive(id);
            renderEmails();
        }

        function clearAllTrash() {
            if (confirm('Are you sure you want to permanently delete all items in the Trash?')) {
                allEmails = allEmails.filter(e => !e.isDeleted); 
                document.getElementById('email-card').style.display = 'none';
                document.getElementById('empty-message').style.display = 'block';
                selectedEmailId = null;
                renderEmails();
            }
        }

        function resetViewerIfActive(id) {
            if (selectedEmailId == id) {
                document.getElementById('email-card').style.display = 'none';
                document.getElementById('empty-message').style.display = 'block';
                selectedEmailId = null;
            }
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            sessionStorage.removeItem('isLoggedIn');
            window.location.href = 'login.html';
        }

        fetchEmails(); 
        setInterval(fetchEmails, 10000);

    </script>
</body>
</html>
