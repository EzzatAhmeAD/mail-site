<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Inbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen font-sans p-4">

    <div id="login-card" class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold text-center text-blue-400 mb-6">Instant Code Receiver</h2>
        <form onsubmit="login(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-400">Email / Username:</label>
                <input type="text" id="username" placeholder="user55@ezzatrabie.com" class="w-full p-3 rounded-lg bg-slate-950 border border-slate-700 focus:outline-none focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-400">Password:</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full p-3 rounded-lg bg-slate-950 border border-slate-700 focus:outline-none focus:border-blue-500" required>
            </div>
            <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition duration-200 cursor-pointer">Login to Inbox</button>
            <p id="error-msg" class="text-red-400 text-sm text-center font-semibold mt-2 hidden"></p>
        </form>
    </div>

    <div id="inbox-card" class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-4xl border border-slate-700 hidden">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div>
                <h2 class="text-xl font-bold text-blue-400">Live Inbox</h2>
                <p id="active-user" class="text-sm text-slate-400 mt-1"></p>
            </div>
            <button onclick="logout()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition cursor-pointer">Logout</button>
        </div>

        <div id="mailbox-view" class="space-y-2">
            <div class="text-sm font-semibold text-slate-400 px-4 py-2 bg-slate-850 rounded-lg flex justify-between border border-slate-700 bg-slate-900">
                <div class="w-1/4">From</div>
                <div class="w-2/4">Subject</div>
                <div class="w-1/4 text-right">Time</div>
            </div>
            <div id="emails-list" class="space-y-2 max-h-[500px] overflow-y-auto pr-2">
                <p class="text-slate-400 text-center py-8">Waiting for verification code...</p>
            </div>
        </div>

        <div id="email-detail-view" class="hidden space-y-4">
            <button onclick="backToInbox()" class="flex items-center text-sm text-blue-400 hover:text-blue-300 font-medium cursor-pointer mb-2">
                ← Back to Inbox
            </button>
            <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800 shadow-md space-y-3">
                <div class="flex flex-wrap justify-between items-center text-xs text-slate-400 bg-slate-900 p-3 rounded-lg border border-slate-800 gap-2">
                    <div><span class="text-blue-400 font-medium">From:</span> <span id="detail-from"></span></div>
                    <div><span class="text-blue-400 font-medium">Received:</span> <span id="detail-date"></span></div>
                </div>
                <div class="text-lg font-semibold text-slate-200 pl-1">
                    <span class="text-blue-500">Subject:</span> <span id="detail-subject"></span>
                </div>
                <div id="detail-content-area"></div>
            </div>
        </div>
    </div>

    <script>
        let checkInterval = null;
        let allEmails = [];

        window.onload = function() {
            const savedUser = localStorage.getItem('saved_username');
            const savedPass = localStorage.getItem('saved_password');
            if (savedUser && savedPass) {
                document.getElementById('username').value = savedUser;
                document.getElementById('password').value = savedPass;
                document.getElementById('login-card').style.display = 'none';
                document.getElementById('inbox-card').classList.remove('hidden');
                document.getElementById('active-user').innerText = `Active Account: ${savedUser}`;
                startChecking(savedUser, savedPass);
            }
        };

        async function login(e) {
            if (e) e.preventDefault();
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('login-btn');
            
            errorMsg.classList.add('hidden');
            loginBtn.innerText = 'Connecting...';

            const userVal = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            try {
                const res = await fetch(`/api/receive-email?username=${encodeURIComponent(userVal)}&password=${encodeURIComponent(pass)}`);
                const data = await res.json();

                if (!res.ok) {
                    errorMsg.innerText = data.error || 'Login failed.';
                    errorMsg.classList.remove('hidden');
                    loginBtn.innerText = 'Login to Inbox';
                    return;
                }

                localStorage.setItem('saved_username', userVal);
                localStorage.setItem('saved_password', pass);
                document.getElementById('login-card').style.display = 'none';
                document.getElementById('inbox-card').classList.remove('hidden');
                document.getElementById('active-user').innerText = `Active Account: ${userVal}`;
                
                allEmails = data.emails || [];
                renderEmailsList();
                startChecking(userVal, pass);
            } catch (err) {
                errorMsg.innerText = 'Server Error.';
                errorMsg.classList.remove('hidden');
                loginBtn.innerText = 'Login to Inbox';
            }
        }

        function startChecking(userVal, pass) {
            if (checkInterval) clearInterval(checkInterval);
            fetchEmails(userVal, pass);
            checkInterval = setInterval(() => { fetchEmails(userVal, pass); }, 2000);
        }

        async function fetchEmails(userVal, pass) {
            try {
                const res = await fetch(`/api/receive-email?username=${encodeURIComponent(userVal)}&password=${encodeURIComponent(pass)}`);
                const data = await res.json();
                if (res.ok) {
                    allEmails = data.emails || [];
                    if (document.getElementById('email-detail-view').classList.contains('hidden')) {
                        renderEmailsList();
                    }
                }
            } catch (err) {
                console.error("Error refreshing emails");
            }
        }

        function renderEmailsList() {
            const list = document.getElementById('emails-list');
            if (!allEmails || allEmails.length === 0) {
                list.innerHTML = '<p class="text-slate-400 text-center py-8">No messages received yet. Trigger the email now.</p>';
                return;
            }
            list.innerHTML = allEmails.map((email, index) => {
                const displaySource = email.source.split('<')[0].replace(/"/g, '').trim() || email.source;
                return `
                    <div onclick="viewEmail(${index})" class="bg-slate-950 hover:bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center cursor-pointer transition duration-150 shadow-sm gap-4">
                        <div class="w-1/4 font-semibold text-blue-400 truncate">${displaySource}</div>
                        <div class="w-2/4 text-slate-300 truncate font-medium">${email.subject}</div>
                        <div class="w-1/4 text-right text-xs text-slate-500">${new Date(email.date).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'})}</div>
                    </div>
                `;
            }).join('');
        }

        function viewEmail(index) {
            const email = allEmails[index];
            if (!email) return;
            document.getElementById('mailbox-view').classList.add('hidden');
            document.getElementById('email-detail-view').classList.remove('hidden');
            document.getElementById('detail-from').innerText = email.source;
            document.getElementById('detail-date').innerText = new Date(email.date).toLocaleString('en-US');
            document.getElementById('detail-subject').innerText = email.subject;
            const contentArea = document.getElementById('detail-content-area');
            if (email.html) {
                contentArea.innerHTML = `<iframe id="detail-frame" class="w-full h-[600px] bg-white rounded-xl border border-slate-700 mt-2 shadow-inner" sandbox="allow-same-origin"></iframe>`;
                setTimeout(() => {
                    const iframe = document.getElementById('detail-frame');
                    if (iframe) {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        doc.open();
                        doc.write(email.html);
                        doc.close();
                    }
                }, 50);
            } else {
                contentArea.innerHTML = `<div class="text-sm text-slate-300 bg-slate-900 p-4 rounded-xl whitespace-pre-line border border-slate-800 mt-2">${email.text}</div>`;
            }
        }

        function backToInbox() {
            document.getElementById('email-detail-view').classList.add('hidden');
            document.getElementById('mailbox-view').classList.remove('hidden');
            renderEmailsList();
        }

        function logout() {
            clearInterval(checkInterval);
            localStorage.clear();
            allEmails = [];
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('email-detail-view').classList.add('hidden');
            document.getElementById('mailbox-view').classList.remove('hidden');
            document.getElementById('login-card').style.display = 'block';
            document.getElementById('inbox-card').classList.add('hidden');
            document.getElementById('login-btn').innerText = 'Login to Inbox';
        }
    </script>
</body>
</html>
