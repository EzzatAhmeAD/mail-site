<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification Inbox</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen font-sans p-4">

    <div id="login-card" class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold text-center text-blue-400 mb-6">Instant Code Receiver</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-400">Email / Username:</label>
                <input type="text" id="username" placeholder="user55@ezzatrabie.com" class="w-full p-3 rounded-lg bg-slate-950 border border-slate-700 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-400">Password:</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full p-3 rounded-lg bg-slate-950 border border-slate-700 focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="login()" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition duration-200 cursor-pointer">Login to Inbox</button>
            <p id="error-msg" class="text-red-400 text-sm text-center font-semibold mt-2 hidden"></p>
        </div>
    </div>

    <div id="inbox-card" class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-2xl border border-slate-700 hidden">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div>
                <h2 class="text-xl font-bold text-blue-400">Live Inbox</h2>
                <p id="active-user" class="text-sm text-slate-400 mt-1"></p>
            </div>
            <button onclick="logout()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition cursor-pointer">Logout</button>
        </div>

        <div id="emails-list" class="space-y-4 max-h-[400px] overflow-y-auto pr-2">
            <p class="text-slate-400 text-center py-8">Waiting for verification code... (Auto-refreshing)</p>
        </div>
    </div>

    <script>
        let checkInterval = null;

        async function login() {
            const user = document.getElementById('username').value.disabled = false;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('login-btn');

            errorMsg.classList.add('hidden');
            errorMsg.innerText = '';
            loginBtn.innerText = 'Connecting...';

            const userVal = document.getElementById('username').value;

            try {
                const res = await fetch(`/api/receive-email?username=${encodeURIComponent(userVal)}&password=${encodeURIComponent(pass)}`);
                const data = await res.json();

                if (!res.ok) {
                    errorMsg.innerText = data.error || 'Login failed. Please check credentials.';
                    errorMsg.classList.remove('hidden');
                    loginBtn.innerText = 'Login to Inbox';
                    return;
                }

                // دخول ناجح
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('inbox-card').classList.remove('hidden');
                document.getElementById('active-user').innerText = `Active Account: ${userVal}`;
                
                renderEmails(data.emails);

                // تحديث كل ثانيتين لسحب الكود
                checkInterval = setInterval(async () => {
                    const refreshRes = await fetch(`/api/receive-email?username=${encodeURIComponent(userVal)}&password=${encodeURIComponent(pass)}`);
                    const refreshData = await refreshRes.json();
                    if (refreshRes.ok) renderEmails(refreshData.emails);
                }, 2000);

            } catch (e) {
                errorMsg.innerText = 'Server Error. Please try again later.';
                errorMsg.classList.remove('hidden');
                loginBtn.innerText = 'Login to Inbox';
            }
        }

        function renderEmails(emails) {
            const list = document.getElementById('emails-list');
            if (!emails || emails.length === 0) {
                list.innerHTML = '<p class="text-slate-400 text-center py-8">No codes received yet... Send the verification code from Epic Games / Riot Games now.</p>';
                return;
            }

            list.innerHTML = emails.map(email => `
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex justify-between text-xs text-slate-500">
                        <span>From: ${email.source}</span>
                        <span>${new Date(email.date).toLocaleTimeString('en-US')}</span>
                    </div>
                    <div class="font-semibold text-blue-300">Subject: ${email.subject}</div>
                    <div class="text-sm text-slate-300 bg-slate-900 p-3 rounded border border-slate-800 whitespace-pre-line">${email.text}</div>
                </div>
            `).join('');
        }

        function logout() {
            clearInterval(checkInterval);
            document.getElementById('login-card').classList.remove('hidden');
            document.getElementById('inbox-card').classList.add('hidden');
            document.getElementById('login-btn').innerText = 'Login to Inbox';
        }
    </script>
</body>
</html>
