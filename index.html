<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Inbox</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.0-alpha.12/dist/index.global.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen font-sans p-4">

    <div id="login-card" class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold text-center text-blue-400 mb-6">Instant Code Receiver</h2>
        <form onsubmit="login(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-400">Email / Username:</label>
                <input type="text" id="username" placeholder="user55@ezzatrabie.com" class="w-full p-3 rounded-lg bg-slate-950 border border-slate-700 focus:outline-none focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-400">Password:</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full p-3 rounded-lg bg-slate-950 border border-slate-700 focus:outline-none focus:border-blue-500" required>
            </div>
            <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition duration-200 cursor-pointer">Login to Inbox</button>
            <p id="error-msg" class="text-red-400 text-sm text-center font-semibold mt-2 hidden"></p>
        </form>
    </div>

    <div id="inbox-card" class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-4xl border border-slate-700 hidden">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div>
                <h2 class="text-xl font-bold text-blue-400">Live Inbox</h2>
                <p id="active-user" class="text-sm text-slate-400 mt-1"></p>
            </div>
            <button onclick="logout()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition cursor-pointer">Logout</button>
        </div>

        <div id="mailbox-view" class="space-y-2">
            <div class="text-sm font-semibold text-slate-400 px-4 py-2 bg-slate-850 rounded-lg flex justify-between border border-slate-750">
                <div class="w-1/4">From</div>
                <div class="w-2/4">Subject</div>
                <div class="w-1/4 text-right">Time</div>
            </div>
            <div id="emails-list" class="space-y-2 max-h-[500px] overflow-y-auto pr-2">
                <p class="text-slate-400 text-center py-8">Waiting for verification code...</p>
            </div>
        </div>

        <div id="email-detail-view" class="hidden space-y-4">
            <button onclick="backToInbox()" class="flex items-center text-sm text-blue-400 hover:text-blue-300 font-medium cursor-pointer mb-2">
                ← Back to Inbox
            </button>
            <div class="bg-slate-950 p-5 rounded-2xl border border-slate-800 shadow-md space-y-3">
                <div class="flex flex-wrap justify-between items-center text-xs text-slate-400 bg-slate-900 p-3 rounded-lg border border-slate-800 gap-2">
                    <div><span class="text-blue-400 font-medium">From:</span> <span id="detail-from"></span></div>
                    <div><span class="text-blue-400 font-medium">Received:</span> <span id="detail-date
