<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Instant Code Receiver</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0b0f19; 
            color: #ffffff;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background: #111c24; 
            padding: 40px 35px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 320px; 
            text-align: center; 
            border: 1px solid #1e293b;
        }
        h2 { 
            margin-top: 0; 
            color: #38bdf8; 
            font-size: 26px; 
            font-weight: 600;
            margin-bottom: 25px; 
        }
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            box-sizing: border-box; 
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s;
        }
        input:focus { 
            border-color: #38bdf8; 
            outline: none; 
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        /* تصميم رسالة الخطأ الداخلية */
        #error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: left;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 15px;
            margin-top: 10px;
            transition: background 0.3s, transform 0.1s;
            font-family: 'Inter', sans-serif;
        }
        button:hover { background: #0369a1; }
        button:active { transform: scale(0.98); }
        
        .remember { 
            text-align: left; 
            margin: 15px 0; 
            font-size: 13px; 
            color: #94a3b8; 
            display: flex; 
            align-items: center; 
            cursor: pointer;
        }
        .remember input { 
            margin-right: 8px; 
            cursor: pointer;
            accent-color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Sign In</h2>
        
        <div id="error-msg">Invalid Username or Password!</div>

        <div class="input-group">
            <input type="text" id="username" placeholder="Email Address (e.g. user55@...)">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
        </div>
        
        <label class="remember">
            <input type="checkbox" id="remember-me">
            Remember me always
        </label>
        
        <button onclick="handleLogin()">Login</button>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') === 'true' || sessionStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'index.html';
            }
        };

        // إخفاء رسالة الخطأ بمجرد ما المستخدم يبدأ يكتب تاني
        document.getElementById('username').addEventListener('input', hideError);
        document.getElementById('password').addEventListener('input', hideError);

        function hideError() {
            document.getElementById('error-msg').style.display = 'none';
        }

        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const remember = document.getElementById('remember-me').checked;
            const errorDiv = document.getElementById('error-msg');

            // اليوزر نيم والباسورد الجديد (تقدر تغيرهم من هنا)
            const correctUser = "user55@ezzatrabie.com";
            const correctPass = "12345678";

            if (user === correctUser && pass === correctPass) { 
                if (remember) {
                    localStorage.setItem('isLoggedIn', 'true'); 
                } else {
                    sessionStorage.setItem('isLoggedIn', 'true'); 
                }
                window.location.href = 'index.html'; 
            } else {
                // إظهار رسالة الخطأ داخل المربع بدلاً من alert
                errorDiv.style.display = 'block';
                // هز المربع لفت الانتباه (حركة إضافية لطيفة)
                const box = document.querySelector('.login-box');
                box.style.transform = 'translateX(-5px)';
                setTimeout(() => box.style.transform = 'translateX(5px)', 100);
                setTimeout(() => box.style.transform = 'translateX(-5px)', 200);
                setTimeout(() => box.style.transform = 'translateX(0)', 300);
            }
        }
    </script>
</body>
</html>
